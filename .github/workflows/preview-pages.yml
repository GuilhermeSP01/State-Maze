name: Deploy pull request preview

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test --if-present

      - name: Build pull request preview
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
        run: npm run build --workspace=@state-maze/game -- --base="$PAGES_BASE"

      - name: Upload preview build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-preview
          path: apps/game/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: >-
      always() && !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages-preview-${{ github.event.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted deployment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Download preview build
        if: github.event.action != 'closed'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pr-preview
          path: pages-build

      - name: Deploy or remove preview
        id: preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1
        with:
          source-dir: pages-build
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          comment: false
          qr-code: false
          pages-base-url: ${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          deploy-commit-message: 'ci: publish preview for PR #${{ github.event.number }}'
          remove-commit-message: 'ci: remove preview for PR #${{ github.event.number }}'

      - name: Show preview link
        if: github.event.action != 'closed'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        run: |
          printf 'Preview URL (available after Pages finishes publishing): %s\n' "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Report preview removal
        if: github.event.action == 'closed'
        run: printf 'The preview for this closed pull request has been removed.\n' >> "$GITHUB_STEP_SUMMARY"
