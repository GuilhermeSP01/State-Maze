<div id="maze-light">
<style>
#maze-light {font: 15px system-ui;color:var(--foreground,CanvasText)}
#maze-light canvas {width:100%;display:block;border-radius:5px}
#maze-light fieldset {border:0;padding:12px 0;margin:0;display:flex;gap:18px;flex-wrap:wrap}
#maze-light label {cursor:pointer}
</style>
<canvas width="648" height="360" role="img" aria-label="Tabuleiro com piso dourado aceso à esquerda de uma parede que projeta sombra à direita."></canvas>
<fieldset aria-label="Opções de iluminação">
<label><input type="checkbox" name="soft" checked> Penumbra</label>
<label><input type="checkbox" name="bloom" checked> Bloom</label>
<label><input type="checkbox" name="second"> Segunda fonte</label>
</fieldset>
</div>
<script>
(()=>{
 const root=document.getElementById('maze-light'), canvas=root.querySelector('canvas'), ctx=canvas.getContext('2d');
 const size=72, walls=[[4,2],[6,1]];
 function blocked(sx,sy,x,y,wx,wy){
   const dx=x-sx||1e-8,dy=y-sy||1e-8;
   const a=(wx-sx)/dx,b=(wx+1-sx)/dx,c=(wy-sy)/dy,d=(wy+1-sy)/dy;
   return Math.max(0,Math.min(a,b),Math.min(c,d))<Math.min(1,Math.max(a,b),Math.max(c,d));
 }
 function draw(){
   const soft=root.querySelector('[name=soft]').checked, bloom=root.querySelector('[name=bloom]').checked;
   const sources=[[2,2]];
   if(root.querySelector('[name=second]').checked)sources.push([7,3]);
   const offsets=soft?[-.32,0,.32]:[0], frame=ctx.createImageData(canvas.width,canvas.height);
   for(let py=0;py<canvas.height;py++)for(let px=0;px<canvas.width;px++){
     const x=(px+.5)/size,y=(py+.5)/size,i=Math.floor(x),j=Math.floor(y);
     const wall=i===0||i===8||j===0||j===4||walls.some(([a,b])=>a===i&&b===j);
     let light=0,halo=0,on=false;
     for(const [a,b] of sources){
       on ||= a===i&&b===j;
       const dx=x-a-.5,dy=y-b-.5;
       let visible=0;
       for(const ox of offsets)for(const oy of offsets){
         if(!walls.some(([wx,wy])=>blocked(a+.5+ox,b+.5+oy,x,y,wx,wy)))visible++;
       }
       light+=visible/(offsets.length**2)*Math.exp(-.58*(dx*dx+dy*dy)**.65);
       const edge=Math.max(0,Math.abs(dx)-.5)**2+Math.max(0,Math.abs(dy)-.5)**2;
       halo+=bloom?Math.exp(-edge/.045)*.7+Math.exp(-edge/.32)*.23:0;
     }
     const grid=(px%size===size-1||py%size===size-1)?.89:1;
     const base=wall?[50,52,54]:on?[232,190,82]:[68,76,86];
     const idx=(py*canvas.width+px)*4;
     for(let k=0;k<3;k++)frame.data[idx+k]=base[k]*grid+light*[179,126,52][k]*(wall?.35:on?.05:1)+halo*[65,62,68][k];
     frame.data[idx+3]=255;
   }
   ctx.putImageData(frame,0,0);
   ctx.fillStyle='#273545';ctx.beginPath();ctx.arc(2.5*size,2.5*size,size/4,0,2*Math.PI);ctx.fill();
 }
 root.addEventListener('change',draw);draw();
})();
</script>
